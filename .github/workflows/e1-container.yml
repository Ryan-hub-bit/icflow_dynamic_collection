name: E1 combined Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/e1-combined-graph-env

permissions:
  contents: read
  packages: write

env:
  BASE_ARCHIVE: icflow-dynamic-collection-amd64.tar.gz
  BASE_URL: https://github.com/Ryan-hub-bit/icflow_dynamic_collection/releases/download/docker-v1/icflow-dynamic-collection-amd64.tar.gz
  BASE_CHECKSUM_URL: https://github.com/Ryan-hub-bit/icflow_dynamic_collection/releases/download/docker-v1/icflow-dynamic-collection-amd64.tar.gz.sha256
  LOCAL_IMAGE: icflownet-e1:ci

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Download and verify the prebuilt base image
        run: |
          curl -fL --retry 3 -o "$BASE_ARCHIVE" "$BASE_URL"
          curl -fL --retry 3 -o "$BASE_ARCHIVE.sha256" "$BASE_CHECKSUM_URL"
          sha256sum -c "$BASE_ARCHIVE.sha256"
          docker load < "$BASE_ARCHIVE"

      - name: Build the combined E1 image
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/e1-docker-build.log"
          if ! docker build --progress=plain -f Dockerfile.e1 -t "$LOCAL_IMAGE" . \
            2>&1 | tee "$build_log"; then
            diagnostic=$(tail -n 80 "$build_log" | \
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' | \
              awk 'BEGIN { ORS="%0A" } { print }')
            echo "::error file=Dockerfile.e1::$diagnostic"
            exit 1
          fi
          docker image inspect "$LOCAL_IMAGE"
          df -h

      - name: Upload a failed image-build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e1-image-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/e1-docker-build.log

      - name: Run the complete E1 verification
        run: |
          set -o pipefail
          runtime_log="$RUNNER_TEMP/e1-runtime.log"
          set +e
          docker run --name icflownet-e1-verification --init \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            "$LOCAL_IMAGE" \
            /opt/icflownet-e1/run_e1.sh \
              --sample testlink \
              --output /output/testlink \
            2>&1 | tee "$runtime_log"
          runtime_status=${PIPESTATUS[0]}
          set -e
          docker cp \
            icflownet-e1-verification:/output/testlink \
            "$RUNNER_TEMP/e1-verification" || true
          if [[ $runtime_status -ne 0 ]]; then
            diagnostic=$(tail -n 80 "$runtime_log" | \
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' | \
              awk 'BEGIN { ORS="%0A" } { print }')
            echo "::error file=e1/run_e1.sh::$diagnostic"
            exit "$runtime_status"
          fi

      - name: Upload the verification report
        uses: actions/upload-artifact@v4
        with:
          name: e1-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/e1-verification/verification.json
            ${{ runner.temp }}/e1-verification/versions.txt
            ${{ runner.temp }}/e1-verification/run.log

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the tested image
        run: |
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/icflow-dynamic-collection"
          short_sha=${GITHUB_SHA:0:12}
          docker tag "$LOCAL_IMAGE" "$image:e1-${short_sha}"
          docker tag "$LOCAL_IMAGE" "$image:e1"
          docker push "$image:e1-${short_sha}"
          docker push "$image:e1"
