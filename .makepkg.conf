#!/hint/bash
# shellcheck disable=SC2034

# Keep the effective build settings used by arch_scripts while inheriting
# current Arch Linux defaults for download tools, compression, and packaging.
source /etc/makepkg.conf

: "${LLVM_BUILD:=$HOME/llvm-project/build}"

CFLAGS="-O3"
CXXFLAGS="$CFLAGS"
LDFLAGS="-fuse-ld=$LLVM_BUILD/bin/ld.lld -no-pie"
MAKEFLAGS="-j$(nproc)"

BUILDENV=(!distcc color !ccache check !sign)
OPTIONS=(!strip)
